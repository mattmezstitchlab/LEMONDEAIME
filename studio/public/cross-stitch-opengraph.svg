<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Point Zéro — Studio de point de croix</title><desc id="desc">Du premier motif à la dernière croix. Créer, préparer, broder.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d9dece"/></pattern></defs><rect width="1200" height="630" fill="#f5f3ed"/><rect x="830" width="370" height="630" fill="url(#grid)"/><g stroke="#314a3c" stroke-width="6"><path d="M900 225l24 24m0-24l-24 24M932 257l24 24m0-24l-24 24M964 289l24 24m0-24l-24 24M996 257l24 24m0-24l-24 24M1028 225l24 24m0-24l-24 24"/></g><g fill="#292d27"><text x="72" y="110" font-family="Arial,sans-serif" font-size="24" letter-spacing="4">× POINT ZÉRO</text><text x="72" y="265" font-family="Georgia,serif" font-size="66">Du premier motif</text><text x="72" y="345" font-family="Georgia,serif" font-style="italic" font-size="66" fill="#314a3c">à la dernière croix.</text><text x="76" y="435" font-family="Arial,sans-serif" font-size="24">Votre studio de point de croix.</text><text x="76" y="535" font-family="Arial,sans-serif" font-size="20" letter-spacing="3">CRÉER · PRÉPARER · BRODER</text></g></svg>
